<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Rincón de Lecturas 📚</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(180deg,#fff8fc 0%,#fff1f7 55%,#fdf7fb 100%);color:#4d3542;min-height:100vh}
header{position:relative;overflow:hidden;padding:64px 20px 58px;text-align:center;background:linear-gradient(135deg,#f8cfe1 0%,#f4d8ea 45%,#e9dafa 100%);border-bottom:1px solid #f0c9dc;box-shadow:0 8px 30px #b76d8b20}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:#ffffff55;pointer-events:none}header:before{width:220px;height:220px;left:-70px;top:-100px}header:after{width:300px;height:300px;right:-120px;bottom:-180px}
.hero-inner{position:relative;z-index:1;max-width:900px;margin:auto}.eyebrow{display:inline-block;margin-bottom:12px;padding:7px 15px;border-radius:999px;background:#fff8fcaa;color:#8d5870;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;font-family:Arial,sans-serif}.hero-title{margin:0;font-size:clamp(2.5rem,7vw,4.5rem);line-height:1.02;color:#653f54;text-shadow:0 2px 0 #ffffff66}.sub{margin:16px 0 0;color:#76576a;font-size:1.05rem}.hero-deco{margin-top:22px;font-size:1.35rem;letter-spacing:.35em;color:#a96984}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:22px 18px 12px;position:sticky;top:0;z-index:5;background:#fff8fce8;backdrop-filter:blur(12px);border-bottom:1px solid #f1dce6}
button{border:0;border-radius:999px;padding:11px 17px;background:#cf7fa3;color:white;font-weight:bold;cursor:pointer;transition:.2s transform,.2s box-shadow,.2s background;font-family:inherit}button:hover{transform:translateY(-2px);box-shadow:0 7px 16px #b9688928;background:#c56f96}button.secondary{background:#f3e0e9;color:#765368}button.secondary:hover{background:#ead0dc}
main{max-width:1100px;margin:auto;padding:20px 18px 55px}.search{max-width:650px;margin:0 auto 22px}.search input{font-size:1rem;padding:14px 18px;box-shadow:0 6px 22px #a96f8520}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid #e7cbd8;border-radius:13px;background:#fff;color:#4d3542;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:#cf7fa3;box-shadow:0 0 0 3px #cf7fa320}
#stats{margin:0 auto 20px;text-align:center}.stats-box{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{background:#fff;border:1px solid #f0dbe5;border-radius:18px;padding:10px 15px;box-shadow:0 5px 18px #a96f8515;font-size:.9rem}.stat b{color:#b55f84;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:22px}.card{background:#fff;border-radius:24px;padding:14px;border:1px solid #f0dbe5;box-shadow:0 9px 28px #a96f8518;overflow:hidden;transition:.2s transform,.2s box-shadow}.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px #a96f8525}
.cover{height:360px;width:100%;border-radius:18px;background:linear-gradient(145deg,#f8e5ed,#eee2f5);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;position:relative}.cover:after{content:"";position:absolute;inset:0;border:1px solid #ffffff55;border-radius:18px;pointer-events:none}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover span{font-size:4rem;opacity:.75}.title{font-size:1.3rem;font-weight:bold;margin-bottom:5px;color:#613f52}.meta{font-size:.9rem;color:#806b76}.progress{height:9px;background:#f1e4ea;border-radius:10px;overflow:hidden;margin:12px 0 7px}.bar{height:100%;background:linear-gradient(90deg,#d47fa5,#c79adf);border-radius:10px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:.78rem;padding:8px 11px}.empty{text-align:center;padding:55px 15px;color:#896f7d;background:#fff;border:1px dashed #e2bfd0;border-radius:22px}
dialog{border:0;border-radius:26px;padding:0;width:min(540px,92%);max-height:90vh;box-shadow:0 25px 70px #4b354244}dialog::backdrop{background:#4b354266;backdrop-filter:blur(3px)}.modal{padding:25px}.close{float:right;background:#f2e8ed;color:#654c5a;padding:8px 12px}.modal h2{margin-top:0;color:#633f53}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:bold}.field small{display:block;margin-top:5px;color:#927684}footer{text-align:center;color:#9a7d8b;font-size:.85rem;padding:24px}
@media(max-width:600px){header{padding:50px 18px 44px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border-radius:19px;padding:10px}.cover{height:285px;border-radius:14px}.title{font-size:1.05rem}.actions button{font-size:.7rem;padding:7px 9px}nav{padding:14px 10px}.hero-deco{font-size:1rem}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.cover{height:390px}}
</style>
</head>
<body>
<header><div class="hero-inner"><div class="eyebrow">mi diario de lecturas</div><h1 class="hero-title">📚 Mi Rincón de Lecturas</h1><p class="sub">Mis libros, mis historias y mi progreso ✨</p><div class="hero-deco">♡ · 📖 · ♡</div></div></header>
<nav>
<button onclick="openForm()">＋ Agregar lectura</button>
<button class="secondary" onclick="filter='all';render()">Todos</button>
<button class="secondary" onclick="filter='reading';render()">Leyendo</button>
<button class="secondary" onclick="filter='finished';render()">Terminados</button>
<button class="secondary" onclick="filter='pending';render()">Pendientes</button>
</nav>
<main>
<div class="search"><input id="search" placeholder="🔎 Buscar una lectura..." oninput="render()"></div>
<div id="stats"></div><div id="grid" class="grid"></div>
</main>
<footer>Hecho para guardar tus lecturas 💗</footer>

<dialog id="dlg"><div class="modal">
<button class="close" onclick="dlg.close()">✕</button>
<h2 id="formTitle">Agregar lectura</h2>
<div class="field"><label>Título</label><input id="title" placeholder="Ej. Mi novela favorita"></div>
<div class="field"><label>Autor</label><input id="author" placeholder="Opcional"></div>
<div class="field"><label>Portada</label><input id="coverFile" type="file" accept="image/*"><small>Elige una imagen desde tu galería 📱🖼️</small></div>
<div class="field"><label>Total de capítulos</label><input id="total" type="number" min="1" value="1"></div>
<div class="field"><label>Capítulos leídos</label><input id="read" type="number" min="0" value="0"></div>
<div class="field"><label>Enlace donde la lees</label><input id="url" placeholder="https://..."></div>
<div class="field"><label>Calificación</label><select id="rating"><option value="0">Sin calificar</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div>
<div class="field"><label>Notas / reseña</label><textarea id="notes" rows="3" placeholder="¿Qué te pareció?"></textarea></div>
<input id="editId" type="hidden">
<button onclick="save()">Guardar lectura 💗</button>
</div></dialog>

<script>
let books=JSON.parse(localStorage.getItem('myBooks')||'[]'),filter='all';
const dlg=document.querySelector('#dlg');
function saveData(){localStorage.setItem('myBooks',JSON.stringify(books))}
function openForm(id=null){
document.querySelector('#formTitle').textContent=id?'Editar lectura':'Agregar lectura';
let b=books.find(x=>x.id===id)||{title:'',author:'',cover:'',total:1,read:0,url:'',rating:'0',notes:''};
for(let k of ['title','author','total','read','url','rating','notes']) document.querySelector('#'+k).value=b[k]??'';
const f=document.querySelector('#coverFile'); f.value='';
document.querySelector('#editId').value=id||''; dlg.showModal();
}
function save(){
let id=document.querySelector('#editId').value;
let old=id?books.find(x=>x.id===Number(id)):null; let b={id:id?Number(id):Date.now(),cover:old?.cover||''};
for(let k of ['title','author','total','read','url','rating','notes']) b[k]=document.querySelector('#'+k).value;
const file=document.querySelector('#coverFile').files[0];
if(file){const r=new FileReader();r.onload=()=>{b.cover=r.result;finish()};r.readAsDataURL(file)} else finish();
return;
function finish(){
b.total=Math.max(1,Number(b.total)||1);b.read=Math.min(b.total,Math.max(0,Number(b.read)||0));
if(id) books=books.map(x=>x.id===Number(id)?b:x); else books.push(b);
saveData();dlg.close();render();
}
}
function status(b){if(b.read>=b.total)return'finished';if(b.read>0)return'reading';return'pending'}
function render(){
let q=document.querySelector('#search').value.toLowerCase(), list=books.filter(b=>(filter==='all'||status(b)===filter)&&((b.title+b.author).toLowerCase().includes(q)));
document.querySelector('#stats').innerHTML=`<div class="stats-box"><div class="stat">📚 <b>${books.length}</b> lecturas</div><div class="stat">📖 <b>${books.filter(b=>status(b)==='reading').length}</b> leyendo</div><div class="stat">✅ <b>${books.filter(b=>status(b)==='finished').length}</b> terminadas</div></div>`;
document.querySelector('#grid').innerHTML=list.length?list.map(b=>{
let p=Math.round(b.read/b.total*100);
return `<article class="card"><div class="cover">${b.cover?`<img src="${esc(b.cover)}" onerror="this.style.display='none'">`:'<span>📖</span>'}</div>
<div class="title">${esc(b.title)||'Sin título'}</div><div class="meta">${esc(b.author)||'Autor no indicado'}</div>
<div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="meta">${b.read}/${b.total} capítulos · ${p}%</div>
<div>${b.rating&&b.rating!=='0'?b.rating:'☆ Sin calificar'}</div><p>${esc(b.notes||'')}</p>
<div class="actions">${b.url?`<button onclick="window.open('${esc(b.url)}','_blank')">🔗 Leer</button>`:''}
<button onclick="openForm(${b.id})">✏️ Editar</button><button onclick="del(${b.id})">🗑️</button></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">Todavía no tienes lecturas aquí.<br>¡Agrega tu primer libro! 📚💗</div>';
}
function del(id){if(confirm('¿Eliminar esta lectura?')){books=books.filter(b=>b.id!==id);saveData();render()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
render();
</script>
</body></html>
