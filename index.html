<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Rincón de Lecturas 📚</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fff7fb;color:#4b3542}
header{padding:34px 20px;text-align:center;background:linear-gradient(135deg,#f7d8e8,#eadcf8)}
h1{margin:0;font-size:2.2rem}.sub{margin:8px 0 0;color:#765b69}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px}
button{border:0;border-radius:18px;padding:10px 16px;background:#d99abc;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#ead9e4;color:#654c5a}
main{max-width:1000px;margin:auto;padding:10px 18px 50px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
input,select,textarea{width:100%;padding:11px;border:1px solid #e4cbd8;border-radius:12px;background:#fff}
.search{max-width:520px;margin:0 auto 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:20px;padding:15px;box-shadow:0 5px 18px #9b71801c;border:1px solid #f0dce6;cursor:pointer;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #9b71802b}
.cover{height:360px;aspect-ratio:2/3;width:100%;max-width:240px;margin:0 auto 10px;border-radius:15px;background:#f1e4ec;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}.cover span{font-size:3rem}
.card-stars{text-align:center;font-size:1.05rem;letter-spacing:1px;margin:2px 0 4px}
.title{font-size:1.25rem;font-weight:bold;margin-bottom:5px;text-align:center}.meta{font-size:.9rem;color:#806b76}
.card .meta.author{text-align:center;margin-bottom:8px}
.progress{height:9px;background:#f0e3ea;border-radius:10px;overflow:hidden;margin:10px 0 4px}.bar{height:100%;background:#d99abc}
.card-progress-text{text-align:center;font-size:.82rem;color:#806b76;margin-bottom:2px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:.78rem;padding:8px 10px}
.detail-cover{height:360px;aspect-ratio:2/3;width:100%;max-width:240px;margin:0 auto 14px;border-radius:16px;background:#f1e4ec;overflow:hidden;display:flex;align-items:center;justify-content:center}
.detail-cover img{width:100%;height:100%;object-fit:cover}.detail-cover span{font-size:4rem}
.detail-stars{text-align:center;font-size:1.2rem;margin-bottom:8px}
.detail-title{text-align:center;font-size:1.55rem;font-weight:bold;margin-bottom:4px}
.detail-author{text-align:center;color:#806b76;margin-bottom:14px}
.detail-info{background:#fff7fb;border-radius:14px;padding:12px;margin:12px 0}
.chapter-box{text-align:center;background:#fff;border:1px solid #f0dce6;border-radius:16px;padding:14px;margin-top:12px}
.rating-box{text-align:center;background:#fff;border:1px solid #f0dce6;border-radius:16px;padding:14px;margin-top:12px}
.rating-stars{font-size:1.45rem;letter-spacing:2px;margin:7px 0}
.rating-stars button{padding:7px 10px}
.rating-stars button{padding:7px 10px}
.chapter-box label{display:block;color:#806b76;font-size:.9rem;margin-bottom:7px}
.chapter-row{display:flex;gap:8px;justify-content:center;align-items:center}
.chapter-row input{max-width:120px;text-align:center;font-size:1.05rem}
.chapter-row button{min-width:48px}
.detail-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.empty{text-align:center;padding:45px 15px;color:#896f7d}
dialog{border:0;border-radius:22px;padding:0;width:min(520px,92%);box-shadow:0 20px 60px #0003}
dialog::backdrop{background:#4b354266}.modal{padding:22px}.field{margin:11px 0}.field label{display:block;margin-bottom:5px;font-size:.9rem}
.close{float:right;background:#eee;color:#654c5a}.modal h2{margin-top:0}
footer{text-align:center;color:#9a7d8b;font-size:.85rem;padding:20px}
</style>
</head>
<body>
<header><h1>📚 Mi Rincón de Lecturas</h1><p class="sub">Mis libros, mis historias y mi progreso ✨</p></header>
<nav>
<button onclick="openForm()">＋ Agregar lectura</button>
<button class="secondary" onclick="filter='all';render()">Todos</button>
<button class="secondary" onclick="filter='reading';render()">Leyendo</button>
<button class="secondary" onclick="filter='finished';render()">Terminados</button>
<button class="secondary" onclick="filter='pending';render()">Pendientes</button>
</nav>
<main>
<div class="search"><input id="search" placeholder="🔎 Buscar una lectura..." oninput="render()"></div>
<div id="stats"></div><div id="grid" class="grid"></div>
</main>
<footer>Hecho para guardar tus lecturas 💗</footer>

<dialog id="detailDlg"><div class="modal">
<button class="close" onclick="detailDlg.close()">✕</button>
<div id="detailContent"></div>
</div></dialog>

<dialog id="dlg"><div class="modal">
<button class="close" onclick="dlg.close()">✕</button>
<h2 id="formTitle">Agregar lectura</h2>
<div class="field"><label>Título</label><input id="title" placeholder="Ej. Mi novela favorita"></div>
<div class="field"><label>Autor</label><input id="author" placeholder="Opcional"></div>
<div class="field"><label>Portada</label><input id="coverFile" type="file" accept="image/*"><small>Elige una imagen desde tu galería 📱🖼️</small></div>
<div class="field"><label>Total de capítulos</label><input id="total" type="number" min="1" value="1"></div>
<div class="field"><label>Capítulos leídos</label><input id="read" type="number" min="0" value="0"></div>
<div class="field"><label>Enlace donde la lees</label><input id="url" placeholder="https://..."></div>
<div class="field"><label>Calificación</label><select id="rating"><option value="0">Sin calificar</option><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div>
<div class="field"><label>Notas / reseña</label><textarea id="notes" rows="3" placeholder="¿Qué te pareció?"></textarea></div>
<input id="editId" type="hidden">
<button onclick="save()">Guardar lectura 💗</button>
</div></dialog>

<script>
let books=JSON.parse(localStorage.getItem('myBooks')||'[]'),filter='all';
const dlg=document.querySelector('#dlg');
const detailDlg=document.querySelector('#detailDlg');
function saveData(){localStorage.setItem('myBooks',JSON.stringify(books))}
function openForm(id=null){
document.querySelector('#formTitle').textContent=id?'Editar lectura':'Agregar lectura';
let b=books.find(x=>x.id===id)||{title:'',author:'',cover:'',total:1,read:0,url:'',rating:'0',notes:''};
for(let k of ['title','author','total','read','url','rating','notes']) document.querySelector('#'+k).value=b[k]??'';
const f=document.querySelector('#coverFile'); f.value='';
document.querySelector('#editId').value=id||''; dlg.showModal();
}
function save(){
let id=document.querySelector('#editId').value;
let old=id?books.find(x=>x.id===Number(id)):null; let b={id:id?Number(id):Date.now(),cover:old?.cover||''};
for(let k of ['title','author','total','read','url','rating','notes']) b[k]=document.querySelector('#'+k).value;
const file=document.querySelector('#coverFile').files[0];
if(file){const r=new FileReader();r.onload=()=>{b.cover=r.result;finish()};r.readAsDataURL(file)} else finish();
return;
function finish(){
b.total=Math.max(1,Number(b.total)||1);b.read=Math.min(b.total,Math.max(0,Number(b.read)||0));
if(id) books=books.map(x=>x.id===Number(id)?b:x); else books.push(b);
saveData();dlg.close();render();
}
}
function status(b){if(b.read>=b.total)return'finished';if(b.read>0)return'reading';return'pending'}
function showDetails(id){
let b=books.find(x=>x.id===id); if(!b)return;
let p=Math.round(b.read/b.total*100);
document.querySelector('#detailContent').innerHTML=`
<div class="detail-cover">${b.cover?`<img src="${esc(b.cover)}" onerror="this.style.display='none'">`:'<span>📖</span>'}</div>
<div class="detail-stars">${b.rating&&b.rating!=='0'?b.rating:'☆ Sin calificar'}</div>
<div class="detail-title">${esc(b.title)||'Sin título'}</div>
<div class="detail-author">${esc(b.author)||'Autor no indicado'}</div>
<div class="detail-info">
<div class="progress"><div class="bar" style="width:${p}%"></div></div>
<div class="meta" style="text-align:center">${b.read}/${b.total} capítulos · ${p}% de progreso</div>
</div>
<div class="chapter-box">
<label>¿En qué capítulo vas?</label>
<div class="chapter-row">
<button onclick="changeChapter(${b.id},-1)">−</button>
<input id="chapterInput" type="number" min="0" max="${b.total}" value="${b.read}" onchange="setChapter(${b.id},this.value)">
<button onclick="changeChapter(${b.id},1)">+</button>
</div>
</div>
<div class="rating-box">
<div class="rating-stars">
<button onclick="changeRating(${b.id},-1)">−</button>
<span>${b.rating&&b.rating!=='0'?b.rating:'☆'}</span>
<button onclick="changeRating(${b.id},1)">+</button>
</div>
</div>
${b.notes?`<p><strong>Notas / reseña:</strong><br>${esc(b.notes)}</p>`:''}
<div class="detail-actions">
${b.url?`<button onclick="window.open('${esc(b.url)}','_blank')">🔗 Leer</button>`:''}
<button onclick="detailDlg.close();openForm(${b.id})">✏️ Editar</button>
<button onclick="detailDlg.close();del(${b.id})">🗑️ Eliminar</button>
</div>`;
detailDlg.showModal();
}
function setChapter(id,value){
let b=books.find(x=>x.id===id); if(!b)return;
b.read=Math.min(b.total,Math.max(0,Number(value)||0));
saveData(); showDetails(id); render();
}
function changeChapter(id,amount){
let b=books.find(x=>x.id===id); if(!b)return;
b.read=Math.min(b.total,Math.max(0,b.read+amount));
saveData(); showDetails(id); render();
}

function changeRating(id,amount){
let b=books.find(x=>x.id===id); if(!b)return;
let current=b.rating==='0'?0:String(b.rating).length;
let next=Math.min(5,Math.max(0,current+amount));
b.rating=next===0?'0':'⭐'.repeat(next);
saveData(); showDetails(id); render();
}

function render(){
let q=document.querySelector('#search').value.toLowerCase(), list=books.filter(b=>(filter==='all'||status(b)===filter)&&((b.title+b.author).toLowerCase().includes(q)));
document.querySelector('#stats').innerHTML=`<p style="text-align:center">📚 ${books.length} lecturas · ✅ ${books.filter(b=>status(b)==='finished').length} terminadas · 📖 ${books.filter(b=>status(b)==='reading').length} leyendo</p>`;
document.querySelector('#grid').innerHTML=list.length?list.map(b=>{
let p=Math.round(b.read/b.total*100);
return `<article class="card" onclick="showDetails(${b.id})">
<div class="cover">${b.cover?`<img src="${esc(b.cover)}" onerror="this.style.display='none'">`:'<span>📖</span>'}</div>
<div class="card-stars">${b.rating&&b.rating!=='0'?b.rating:'☆'}</div>
<div class="title">${esc(b.title)||'Sin título'}</div>
<div class="meta author">${esc(b.author)||'Autor no indicado'}</div>
<div class="progress"><div class="bar" style="width:${p}%"></div></div>
<div class="card-progress-text">${b.read}/${b.total} capítulos · ${p}%</div>
</article>`}).join(''):'<div class="empty" style="grid-column:1/-1">Todavía no tienes lecturas aquí.<br>¡Agrega tu primer libro! 📚💗</div>';
}
function del(id){if(confirm('¿Eliminar esta lectura?')){books=books.filter(b=>b.id!==id);saveData();render()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
render();
</script>
</body></html>
